[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lones-vdl"
version = "0.1.0"
description = "YouTube and Twitch video archival system (server-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lones-VDL contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[project.scripts]
lones-vdl = "lones_vdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lones_vdl"]

[tool.hatch.build.targets.wheel.sources]
"src/lones_vdl" = "lones_vdl"

[tool.hatch.build.targets.sdist]
include = ["src/lones_vdl", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
