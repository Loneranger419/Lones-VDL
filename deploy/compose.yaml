# Production (Linux VM). Copy deploy/.env.example → deploy/.env and set LONES_VDL_HOST_ARCHIVE.
#   docker compose -f deploy/compose.yaml up -d --build
name: lones-vdl

services:
  lones-vdl:
    image: lones-vdl:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${LONES_VDL_PORT:-8080}:8080"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      # Local disk: SQLite, cookies, yt-dlp venv, logs. Never put this on a network share.
      - data:/data
      # Media archive (NAS mount on the VM).
      - ${LONES_VDL_HOST_ARCHIVE:-/mnt/lonesvdl}:/archive

volumes:
  data:
