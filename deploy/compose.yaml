# Target: headless Linux host. Mount NAS at ARCHIVE_ROOT; keep DB on a local volume.
# Local smoke (from repo): copy deploy/.env.example → deploy/.env, then:
#   docker compose -f deploy/compose.yaml up --build
services:
  lones-vdl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${LONES_VDL_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      LONES_VDL_HOST: "0.0.0.0"
      LONES_VDL_PORT: "8080"
      LONES_VDL_ARCHIVE_ROOT: /archive
      LONES_VDL_DATABASE_PATH: /var/lib/lones-vdl/lones_vdl.db
      LONES_VDL_WEB_DIST: /app/web/dist
      LONES_VDL_YTDLP_EXECUTABLE: yt-dlp
    volumes:
      # Host archive path (NAS mount on Linux; ../data/archive for local smoke).
      - ${LONES_VDL_HOST_ARCHIVE:-../data/archive}:/archive
      # SQLite on local Docker volume (not on SMB/NFS).
      - lones-vdl-db:/var/lib/lones-vdl
      # Cookies / secrets (set LONES_VDL_YTDLP_COOKIES_FILE=/secrets/cookies.txt in .env).
      - ${LONES_VDL_HOST_SECRETS:-../secrets}:/secrets:ro
    restart: unless-stopped

volumes:
  lones-vdl-db:
